<script>
    function toggleForm() {
        const login = document.getElementById('loginForm');
        const reg = document.getElementById('registerForm');
        login.style.display = login.style.display === 'none' ? 'block' : 'none';
        reg.style.display = reg.style.display === 'none' ? 'block' : 'none';
    }

    async function login() {
        const btn = document.querySelector('#loginForm .btn');
        btn.innerText = 'Memproses...';
        btn.disabled = true;

        try {
            const res = await fetch('/api/login', { 
                method: 'POST', 
                headers: {'Content-Type':'application/json'}, 
                body: JSON.stringify({ 
                    username: document.getElementById('username').value, 
                    password: document.getElementById('password').value 
                })
            });
            
            const data = await res.json();
            
            if(data.success) {
                window.location.href = '/dashboard';
            } else {
                alert('Login Gagal: ' + (data.message || data.error || 'Cek username/password'));
            }
        } catch (error) {
            alert('KONEKSI ERROR: Server backend mati atau database terputus!');
            console.error(error);
        } finally {
            btn.innerText = 'Masuk Sistem';
            btn.disabled = false;
        }
    }

    async function register() {
        const btn = document.querySelector('#registerForm .btn');
        btn.innerText = 'Mendaftar...';
        btn.disabled = true;

        try {
            const res = await fetch('/api/register', { 
                method: 'POST', 
                headers: {'Content-Type':'application/json'}, 
                body: JSON.stringify({ 
                    full_name: document.getElementById('regName').value, 
                    username: document.getElementById('regUsername').value, 
                    password: document.getElementById('regPassword').value 
                })
            });
            
            const data = await res.json();
            
            if(data.success) { 
                alert('Registrasi Berhasil! Silakan Login.'); 
                toggleForm(); 
            } else {
                alert('Daftar Gagal: ' + (data.message || data.error || 'Username mungkin sudah dipakai'));
            }
        } catch (error) {
            alert('KONEKSI ERROR: Server backend mati atau database terputus!');
            console.error(error);
        } finally {
            btn.innerText = 'Daftar Akun';
            btn.disabled = false;
        }
    }
</script>
